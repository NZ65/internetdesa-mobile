name: internetdesa_mobile
description: "Aplikasi Terpadu InternetDesa untuk Admin, Teknisi, dan Sales"
publish_to: "none"
version: 1.5.6+13

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Networking & HTTP
  dio: ^5.7.0

  # Storage & Preferences
  shared_preferences: ^2.3.3

  # Formatting & Localization
  intl: ^0.19.0

  # Hardware & Device Features
  image_picker: ^1.1.2
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  flutter_local_notifications: ^17.2.3

  # UI & Design
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  geolocator_android: 4.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

