name: Build & Release Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      - name: 🔨 Build Release APK
        run: flutter build apk --release

      - name: 📤 Upload APK Artifact (Downloadable)
        uses: actions/upload-artifact@v4
        with:
          name: internetdesa-mobile-latest
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: 🚀 Auto-Deploy APK Directly to Production Server
        run: |
          RAW_VER=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d ' ' | tr -d '\r')
          VER_NAME=$(echo "$RAW_VER" | cut -d'+' -f1)
          VER_CODE=$(echo "$RAW_VER" | cut -d'+' -f2)
          echo "Deploying APK version $VER_NAME (code: $VER_CODE) directly to internetdesaku.my.id..."
          curl -f -s -X POST https://internetdesaku.my.id/api/mobile/deploy-apk \
            -H "x-deploy-token: ind_apk_deploy_sec_98273410fbc8921" \
            -F "apk=@build/app/outputs/flutter-apk/app-release.apk" \
            -F "version=$VER_NAME" \
            -F "version_code=$VER_CODE" \
            -F "changelog=Pembaruan Resmi: Logo Baru Internet Desa Sukorejo di seluruh aplikasi & web dashboard, pembaruan ikon launcher, dan auto-update OTA." \
            && echo "✅ Auto-deploy to server SUCCEEDED!" \
            || echo "⚠️ Direct server upload failed, artifact is still safely saved in GitHub."
